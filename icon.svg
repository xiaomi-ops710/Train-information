<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A040"/>
      <stop offset="0.55" stop-color="#00A040"/>
      <stop offset="1" stop-color="#80C241"/>
    </linearGradient>
  </defs>
  <!-- 背景：外周の枠線なしで全面塗りつぶし（iPadの角丸トリミング対応） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ナンバリング枠（セーフゾーン） -->
  <rect x="56" y="56" width="400" height="400" rx="56" fill="#ffffff" stroke="url(#frame)" stroke-width="26"/>
  <!-- タイポグラフィ -->
  <text x="256" y="250" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-weight="900" font-size="150" fill="#111111" textLength="290" lengthAdjust="spacing">運行</text>
  <text x="256" y="316" text-anchor="middle" font-family="Roboto,'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="42" fill="#111111" textLength="290" lengthAdjust="spacing">TRAIN INFO</text>
  <!-- 3色ステータスバー -->
  <rect x="98"  y="360" width="96" height="30" rx="15" fill="#00A040"/>
  <rect x="208" y="360" width="96" height="30" rx="15" fill="#F39800"/>
  <rect x="318" y="360" width="96" height="30" rx="15" fill="#E60012"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
