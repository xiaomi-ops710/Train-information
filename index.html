<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="運行情報">
<title>運行情報 | Service Information</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="hdr">
  <div class="hdr-top">
    <div class="hdr-l">
      <h1 class="title" data-i18n="title"></h1>
      <span class="meter" id="meter"><i class="mdot"></i><span id="meterTxt">--</span></span>
      <button class="abn-badge" id="abnBadge" aria-label="異常路線の一覧を開く"><span class="material-symbols-outlined">warning</span><span id="abnTxt">--</span></button>
    </div>
    <div class="hdr-r">
      <span class="demo-chip" id="demoChip" hidden>DEMO</span>
      <span class="lamp" id="lamp" title="稼働中"></span>
      <time class="clock" id="clock">--:--:--</time>
      <button class="icon-btn" id="btnRefresh" aria-label="更新"><span class="material-symbols-outlined">refresh</span></button>
      <button class="icon-btn" id="btnSettings" aria-label="設定"><span class="material-symbols-outlined">settings</span></button>
    </div>
  </div>
  <div class="hdr-ctl">
    <nav class="tabs" id="companyTabs" aria-label="鉄道会社"></nav>
    <div class="actions">
      <button class="cbtn" id="btnSearch"><span class="material-symbols-outlined">search</span><span class="lbl-l" data-i18n="search"></span><span class="lbl-s">検索</span></button>
      <button class="cbtn" id="btnStation"><span class="material-symbols-outlined">pin_drop</span><span class="lbl-l" data-i18n="myStation"></span><span class="lbl-s">マイ駅</span></button>
      <button class="cbtn" id="btnFocus" aria-pressed="false"><span class="material-symbols-outlined">warning</span><span class="lbl-l" data-i18n="focus"></span><span class="lbl-s">異常</span></button>
      <button class="cbtn" id="btnCycle" aria-pressed="false"><span class="material-symbols-outlined">autorenew</span><span class="lbl-l" data-i18n="cycle"></span><span class="lbl-s">自動</span></button>
      <button class="cbtn" id="btnHistory"><span class="material-symbols-outlined">history</span><span class="lbl-l" data-i18n="history"></span><span class="lbl-s">履歴</span></button>
      <button class="cbtn" id="btnClock" aria-pressed="false"><span class="material-symbols-outlined">schedule</span><span class="lbl-l">LCD時計<small class="en">Clock</small></span><span class="lbl-s">時計</span></button>
    </div>
  </div>
</header>
<div class="favbar" id="favBar" hidden></div>

<main class="stage" id="stage">
  <div class="map" id="map"></div>
  <div class="board" id="abnBoard" hidden></div>
  <div class="clockmode" id="clockMode" hidden></div>
  <div class="legend" id="legend"></div>
  <div class="detour-bar" id="detourBar" hidden></div>
  <div class="loc-chip" id="locChip" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="zoom">
    <button class="icon-btn" id="btnLocate" aria-label="現在地へ移動"><span class="material-symbols-outlined">my_location</span></button>
    <button class="icon-btn" id="zoomIn" aria-label="拡大"><span class="material-symbols-outlined">add</span></button>
    <button class="icon-btn" id="zoomOut" aria-label="縮小"><span class="material-symbols-outlined">remove</span></button>
    <button class="icon-btn" id="zoomReset" aria-label="リセット"><span class="material-symbols-outlined">center_focus_strong</span></button>
  </div>
</main>
<footer class="ticker" id="ticker">
  <div class="ticker-label">運行情報</div>
  <div class="ticker-view"><div class="ticker-track" id="tickerTrack"></div></div>
</footer>

<!-- 設定：JR指定席券売機（MV50系）風タッチパネル -->
<div class="modal" id="modalSettings" hidden>
  <div class="mv" role="dialog" aria-modal="true" aria-label="運行情報システム設定">
    <div class="mv-screen">
      <div class="mv-head">
        <span class="mv-badge"><span class="material-symbols-outlined">train</span><i class="material-symbols-outlined gear">settings</i></span>
        <div class="mv-title"><b>運行情報システム設定</b><small>System Settings</small></div>
        <span class="mv-ic">LCD</span>
      </div>
      <div class="mv-cats" id="mvCats"></div>
      <div class="mv-body">
        <div id="mvMain"></div>
        <div class="mv-grid" id="mvGrid"></div>
        <div class="mv-sync">
          <div class="row sync"><div>最終同期時刻 <small class="en">Last sync</small></div><div class="sync-val" id="syncTime">--</div></div>
          <div class="row sync"><div>取得ステータス <small class="en">Sync status</small></div><div class="sync-val" id="syncState">未同期</div></div>
        </div>
      </div>
      <div class="mv-maint">
        <button class="mv-silver" data-act="clearCache"><span class="material-symbols-outlined">cleaning_services</span><span class="ms-lbl"><b>キャッシュ強制クリア</b><small>タップ2回で実行</small></span></button>
        <button class="mv-silver" data-act="resetLog"><span class="material-symbols-outlined">delete_sweep</span><span class="ms-lbl"><b>履歴ログ・メモの初期化</b><small>タップ2回で実行</small></span></button>
        <button class="mv-silver" data-act="links"><span class="material-symbols-outlined">receipt_long</span><span class="ms-lbl"><b>公式遅延証明書リンク集</b><small>各社の公式ページへ</small></span></button>
      </div>
      <div class="mv-foot">
        <button class="mv-cancel" data-close aria-label="閉じる"><b>取消</b><small>閉じる</small></button>
        <div class="mv-footinfo">
          <button class="mv-bright" id="mvBright"><span class="material-symbols-outlined">brightness_medium</span><span class="ms-lbl"><b>明るさ調整</b><small>夜間減光 <span id="mvBrightState">OFF</span></small></span></button>
          <time class="mv-time" id="mvTime"></time>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 路線検索モーダル -->
<div class="modal" id="modalSearch" hidden>
  <div class="sheet sheet-search" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 data-i18n="search"></h2>
      <button class="icon-btn" data-close aria-label="閉じる"><span class="material-symbols-outlined">close</span></button></div>
    <div class="searchbar">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="searchInput" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clear" id="searchClear" aria-label="クリア" hidden><span class="material-symbols-outlined">cancel</span></button>
    </div>
    <div class="search-meta" id="searchMeta"></div>
    <div class="list" id="searchList"></div>
  </div>
</div>

<!-- マイ駅（乗り換え案内風） -->
<div class="modal" id="modalStation" hidden>
  <div class="sheet sheet-search" id="stnSheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2>マイ駅<span class="en">My Stations</span></h2>
      <button class="icon-btn" data-close aria-label="閉じる"><span class="material-symbols-outlined">close</span></button></div>
    <div class="searchbar" id="stnSearch">
      <span class="material-symbols-outlined">search</span>
      <input type="text" id="stnInput" placeholder="駅名で検索（★でマイ駅に登録）" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clear" id="stnClear" aria-label="クリア" hidden><span class="material-symbols-outlined">cancel</span></button>
    </div>
    <div class="list" id="stnList"></div>
  </div>
</div>

<!-- 履歴ログ -->
<div class="modal" id="modalHistory" hidden>
  <div class="sheet sheet-search" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2>履歴ログ<span class="en">Status History</span></h2>
      <button class="icon-btn" data-close aria-label="閉じる"><span class="material-symbols-outlined">close</span></button></div>
    <div class="search-meta">運行ステータスの変化を自動記録（最新50件）</div>
    <div class="list" id="histList"></div>
  </div>
</div>

<!-- 公式遅延証明書リンク集 -->
<div class="modal" id="modalLinks" hidden>
  <div class="sheet sheet-search" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2>公式遅延証明書リンク集<span class="en">Delay Certificates</span></h2>
      <button class="icon-btn" data-close aria-label="閉じる"><span class="material-symbols-outlined">close</span></button></div>
    <div class="search-meta">各社サイトの変更でページが開けない場合は、「公式サイト」から探してください。</div>
    <div class="list" id="linksList"></div>
  </div>
</div>

<!-- 異常路線クイック一覧 -->
<div class="modal" id="modalAbn" hidden>
  <div class="sheet sheet-search" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2>異常路線一覧<span class="en">Service Disruptions</span></h2>
      <button class="icon-btn" data-close aria-label="閉じる"><span class="material-symbols-outlined">close</span></button></div>
    <div class="search-meta" id="abnMeta"></div>
    <div class="list" id="abnList"></div>
  </div>
</div>

<!-- E235系 異常時案内風ポップアップ -->
<div class="modal" id="modalDetail" hidden>
  <div class="bezel" role="dialog" aria-modal="true">
    <button class="bezel-close" data-close aria-label="閉じる"><span class="material-symbols-outlined">close</span></button>
    <div id="detailBody"></div>
  </div>
</div>

<div id="lcdOverlay"></div>
<div id="dimOverlay"></div>
<script src="./app.js"></script>
</body>
</html>
